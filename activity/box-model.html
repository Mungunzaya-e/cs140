<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .card {
            background-color: #8fefca;
            width: 450px;
            padding: 10px 30px 10px 30px;
            border: 3px solid rgb(78, 166, 149);
            box-sizing: border-box;
            margin: 0 auto 25px;
        }

        p, h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>“A World of Dew” by Kobayashi Issa</h2>
        <p>
            A world of dew,<br>
            And within every dewdrop<br>
            A world of struggle.
        </p>
    </div>
    <div class="card">
        <h2>“A Poppy Blooms” by Katsushika Hokusai</h2>
        <p>
            I write, erase, rewrite<br>
            Erase again, and then<br>
            A poppy blooms.
        </p>
    </div>
</body>
</html>
